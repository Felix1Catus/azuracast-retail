# Builds the Acacia Radio images for every release tag (v<version>-retail.<n>) and publishes them to the GitHub
# Container Registry, so installs and updates download them instead of building for 20-40 minutes:
#   ghcr.io/felix1catus/acacia-radio:<version>                     (also :latest)
#   ghcr.io/felix1catus/acacia-radio-music-downloader:<version>    (also :latest)
# util/install_retail.sh and `./docker.sh update` pull these and fall back to a local build when they can't.
# Run it by hand for an existing tag from the Actions tab ("Run workflow").
name: Release images

on:
  push:
    tags: ["v*-retail.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v0.23.8-retail.17"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      REGISTRY: ghcr.io/felix1catus
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out the release
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Work out the version
        id: v
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -n1 --pretty=%ci HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push acacia-radio
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/acacia-radio:${{ steps.v.outputs.version }}
            ${{ env.REGISTRY }}/acacia-radio:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Felix1Catus/azuracast-retail
            org.opencontainers.image.title=Acacia Radio
            org.opencontainers.image.description=Self-hosted radio for many channels on one server
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ steps.v.outputs.commit }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          build-args: |
            GIT_COMMIT=${{ steps.v.outputs.commit }}
            GIT_COMMIT_DATE=${{ steps.v.outputs.date }}
            GIT_BRANCH=${{ env.TAG }}
          cache-from: type=gha,scope=acacia-radio
          cache-to: type=gha,scope=acacia-radio,mode=max

      - name: Build and push acacia-radio-music-downloader
        uses: docker/build-push-action@v6
        with:
          context: plugins/music-downloader/worker
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/acacia-radio-music-downloader:${{ steps.v.outputs.version }}
            ${{ env.REGISTRY }}/acacia-radio-music-downloader:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Felix1Catus/azuracast-retail
            org.opencontainers.image.title=Acacia Radio Music Downloader
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha,scope=music-downloader
          cache-to: type=gha,scope=music-downloader,mode=max
