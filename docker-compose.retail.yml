#
# Acacia Radio: Docker Compose file for a deployment.
#
# Copy it to the install directory as docker-compose.yml, next to .env and acacia.env
# (see docs/retail/INSTALL.md). It follows docker-compose.sample.yml so docker.sh, backups and
# plugin installers keep working, with these differences:
#   - image: the fork image built with util/build_image.sh, never the upstream image
#   - ports: only HTTP/HTTPS. Players reach every station through nginx at /listen/{station}/{mount}
#     (Administration > Settings > "Use Web Proxy for Radio" must stay on). No SFTP port.
#   - no `updater` container: it would replace this image with upstream.
#   - Music Downloader (built-in module, plugins/music-downloader): the `music-downloader` worker (spotDL,
#     built by util/build_image.sh), `music-downloader-pot` (YouTube PO tokens) and `music-downloader-browser`
#     (the YouTube account's Chromium, same image as the worker). All are internal only and share a secret
#     through music-downloader.env, which the installer and `./docker.sh update` create.
#
# Other plugins are mounted from docker-compose.override.yml.
#

name: acacia

services:
  web:
    container_name: acacia
    image: "${ACACIA_IMAGE:-acacia-radio:latest}"
    pull_policy: never
    ports:
      - '${ACACIA_HTTP_PORT:-80}:${ACACIA_HTTP_PORT:-80}'
      - '${ACACIA_HTTPS_PORT:-443}:${ACACIA_HTTPS_PORT:-443}'
    env_file:
      - acacia.env
      - .env
      - path: music-downloader.env
        required: false
    volumes:
      - station_data:/var/acacia/stations
      - backups:/var/acacia/backups
      - db_data:/var/lib/mysql
      - www_uploads:/var/acacia/storage/uploads
      - shoutcast2_install:/var/acacia/storage/shoutcast2
      - stereo_tool_install:/var/acacia/storage/stereo_tool
      - rsas_install:/var/acacia/storage/rsas
      - geolite_install:/var/acacia/storage/geoip
      - sftpgo_data:/var/acacia/storage/sftpgo
      - acme:/var/acacia/storage/acme
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      options:
        max-size: "1m"
        max-file: "5"

  music-downloader:
    container_name: acacia_music_downloader
    image: "${MUSIC_DOWNLOADER_IMAGE:-acacia-radio-music-downloader:latest}"
    pull_policy: never
    env_file:
      - path: music-downloader.env
        required: false
    volumes:
      - station_data:/var/acacia/stations
      - music_downloader_data:/data
    restart: unless-stopped
    cpu_shares: 256            # the radio comes first on small servers
    mem_limit: 1g
    logging:
      options:
        max-size: "1m"
        max-file: "3"

  music-downloader-browser:
    container_name: acacia_music_downloader_browser
    # Same image as the worker; keeps the YouTube account's Chromium profile (app/browser.py).
    # Chromium only runs during a cookie refresh or while an admin uses the browser view.
    image: "${MUSIC_DOWNLOADER_IMAGE:-acacia-radio-music-downloader:latest}"
    pull_policy: never
    command: [ "xvfb-run", "-a", "-s", "-screen 0 1280x800x24 -nolisten tcp",
               "python", "-m", "uvicorn", "app.browser_api:app", "--host", "0.0.0.0", "--port", "8001", "--no-access-log" ]
    env_file:
      - path: music-downloader.env
        required: false
    volumes:
      - music_downloader_browser:/data
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=4)" ]
      interval: 60s
      timeout: 5s
      start_period: 20s
    restart: unless-stopped
    cpu_shares: 256
    mem_limit: 1g
    shm_size: 256m
    logging:
      options:
        max-size: "1m"
        max-file: "3"

  music-downloader-pot:
    container_name: acacia_music_downloader_pot
    # Same version as bgutil-ytdlp-pot-provider in plugins/music-downloader/worker/requirements.txt.
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2-deno
    restart: unless-stopped
    cpu_shares: 256
    mem_limit: 512m
    logging:
      options:
        max-size: "1m"
        max-file: "3"

volumes:
  music_downloader_data: { }
  music_downloader_browser: { }
  db_data: { }
  acme: { }
  shoutcast2_install: { }
  stereo_tool_install: { }
  rsas_install: { }
  geolite_install: { }
  sftpgo_data: { }
  station_data: { }
  www_uploads: { }
  backups: { }
